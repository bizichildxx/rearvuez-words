</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"}}</script></head><body><div class="hud"><div class="top"><div class="brand"><b>RearVuez × Al3X MiX</b><small>WORDS — THE VIRTUAL CLUB</small></div><div class="live"><span class="dot"></span>VR FLOOR OPEN</div></div><div class="centerMsg" id="centerMsg"><b>WORDS VR</b><span>Choose a film, then enter the floor</span></div><div class="panel"><div class="card"><div class="eyebrow" id="kicker">Sir, yes sir</div><h1 id="title">WORDS (SIR YES SIR)</h1><div class="artist" id="artist">RearVuez × Al3X MiX</div><div class="controls"><button class="btn primary" id="play">Play film</button><button class="btn" id="mute">Mute</button><button class="btn" id="recenter">Recenter view</button></div><div class="timeline"><input id="seek" type="range" min="0" max="1000" value="0"/><div class="time" id="time">0:00 / 0:00</div></div><div class="tracks" id="tracks"></div></div><div class="side"><div class="badge">Desktop · Touch · WebXR</div><div class="tip">Drag to look around. Headphones recommended. In a compatible headset, use ENTER VR.</div></div></div></div><video id="film" playsinline webkit-playsinline preload="metadata" crossorigin="anonymous" style="position:fixed;width:2px;height:2px;opacity:.001;pointer-events:none"></video><script type="module">
import * as THREE from 'three';import{VRButton}from'three/addons/webxr/VRButton.js';
const MEDIA='https://words-vr.rearvuez.chatgpt.site/media';
const TRACKS=[
{id:'words',title:'WORDS (SIR YES SIR)',artist:'RearVuez × Al3X MiX',kicker:'Sir, yes sir',duration:'4:27',video:`${MEDIA}/videos/words.mp4`,poster:`${MEDIA}/posters/words.jpg`},
{id:'floor',title:'THE DANCE FLOOR KNOWS',artist:'RearVuez',kicker:'Cut 2',duration:'4:53',video:`${MEDIA}/videos/dance-floor-knows.mp4`,poster:`${MEDIA}/posters/dance-floor-knows.jpg`},
{id:'chk',title:'CHK N’ DKN',artist:'Al3X MiX',kicker:'Director’s Cut',duration:'3:20',video:`${MEDIA}/videos/chk-n-dkn-directors-cut.mp4`,poster:`${MEDIA}/posters/chk-n-dkn.jpg`}
];
const film=document.querySelector('#film'),playBtn=document.querySelector('#play'),muteBtn=document.querySelector('#mute'),seek=document.querySelector('#seek'),time=document.querySelector('#time'),title=document.querySelector('#title'),artist=document.querySelector('#artist'),kicker=document.querySelector('#kicker'),tracksEl=document.querySelector('#tracks'),centerMsg=document.querySelector('#centerMsg');let active=0;
TRACKS.forEach((t,i)=>{const b=document.createElement('button');b.className='btn track'+(i===0?' active':'');b.innerHTML=`<span>${t.title}</span><small>${t.artist} · ${t.duration}</small>`;b.onclick=()=>loadTrack(i,true);tracksEl.appendChild(b)});
function loadTrack(i,auto=false){active=i;const t=TRACKS[i];film.pause();film.removeAttribute('src');film.load();title.textContent=t.title;artist.textContent=t.artist;kicker.textContent=t.kicker;[...tracksEl.children].forEach((b,n)=>b.classList.toggle('active',n===i));film.poster=t.poster;film.src=t.video;film.currentTime=0;film.load();seek.value=0;time.textContent=`0:00 / ${t.duration}`;centerMsg.innerHTML=`<b>${t.title}</b><span>${t.artist}</span>`;centerMsg.style.opacity='.28';if(auto)film.play().catch(()=>{centerMsg.style.opacity='1';});}
function fmt(s){if(!Number.isFinite(s))return'0:00';const m=Math.floor(s/60),ss=Math.floor(s%60);return`${m}:${String(ss).padStart(2,'0')}`}
film.addEventListener('play',()=>playBtn.textContent='Pause');film.addEventListener('pause',()=>playBtn.textContent='Play film');film.addEventListener('timeupdate',()=>{if(film.duration){seek.value=Math.round(film.currentTime/film.duration*1000);time.textContent=`${fmt(film.currentTime)} / ${fmt(film.duration)}`}});film.addEventListener('loadedmetadata',()=>time.textContent=`0:00 / ${fmt(film.duration)}`);film.addEventListener('error',()=>{const t=TRACKS[active];centerMsg.innerHTML=`<b>VIDEO LINK ISSUE</b><span>${t.title}</span>`;centerMsg.style.opacity='1'});playBtn.onclick=()=>film.paused?film.play().catch(()=>{}):film.pause();muteBtn.onclick=()=>{film.muted=!film.muted;muteBtn.textContent=film.muted?'Unmute':'Mute'};seek.oninput=()=>{if(film.duration)film.currentTime=+seek.value/1000*film.duration};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050404);scene.fog=new THREE.FogExp2(0x050404,.035);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,120);camera.position.set(0,1.65,7.4);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.xr.enabled=true;document.body.prepend(renderer.domElement);const texture=new THREE.VideoTexture(film);texture.colorSpace=THREE.SRGBColorSpace;const screen=new THREE.Mesh(new THREE.PlaneGeometry(11.6,6.525),new THREE.MeshBasicMaterial({map:texture,toneMapped:false}));screen.position.set(0,3.9,-8.8);scene.add(screen);const frame=new THREE.Mesh(new THREE.PlaneGeometry(12,6.9),new THREE.MeshBasicMaterial({color:0xd5ad44}));frame.position.set(0,3.9,-8.9);scene.add(frame);const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:0x0b0809,roughness:.25,metalness:.65}));floor.rotation.x=-Math.PI/2;scene.add(floor);scene.add(new THREE.AmbientLight(0x351820,1.2));const r1=new THREE.PointLight(0xe11d2f,28,30);r1.position.set(-8,5,-1);scene.add(r1);const r2=new THREE.PointLight(0xf0c419,20,30);r2.position.set(8,5,3);scene.add(r2);for(let i=0;i<26;i++){const a=i/26*Math.PI*2,rr=6+(i%4)*2;const p=new THREE.Mesh(new THREE.CircleGeometry(.45,20),new THREE.MeshBasicMaterial({color:i%2?0xf0c419:0xe11d2f,transparent:true,opacity:.25}));p.rotation.x=-Math.PI/2;p.position.set(Math.sin(a)*rr,.02,Math.cos(a)*rr-1);scene.add(p)}
const vrButton=VRButton.createButton(renderer);vrButton.style.position='fixed';vrButton.style.right='18px';vrButton.style.top='78px';vrButton.style.bottom='auto';vrButton.style.left='auto';vrButton.style.border='1px solid #d5ad44';vrButton.style.background='#0d0b0be8';vrButton.style.color='white';vrButton.style.zIndex='10';document.body.appendChild(vrButton);
let yaw=0,pitch=0,ty=0,tp=0,drag=false,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;ty-=(e.clientX-lx)*.0038;tp-=(e.clientY-ly)*.0032;tp=Math.max(-.7,Math.min(.7,tp));lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);document.querySelector('#recenter').onclick=()=>{ty=tp=0};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{yaw+=(ty-yaw)*.09;pitch+=(tp-pitch)*.09;if(!renderer.xr.isPresenting)camera.rotation.set(pitch,yaw,0,'YXZ');renderer.render(scene,camera)});loadTrack(0,false);
</script></body></html>
