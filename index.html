<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#070606" />
<title>WORDS VR — RearVuez × Al3X MiX | The Virtual Club</title>
<meta name="description" content="Step onto the WORDS VR floor: a dark red-and-gold virtual club with three RearVuez × Al3X MiX films and WebXR support." />
<style>
:root{--bg:#090707;--fg:#f2eee8;--surface:rgba(18,13,14,.84);--elev:#211719;--primary:#b52230;--gold:#d7aa35;--muted:#a5948e;--border:rgba(133,88,70,.42);--font:"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}button,input{font:inherit}.stage{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none;z-index:5}.header{position:absolute;top:0;left:0;right:0;padding:20px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.brand-kicker{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.42em;text-transform:uppercase;text-shadow:0 0 18px rgba(215,170,53,.45)}.brand-title{margin-top:8px;font-size:14px;font-weight:700;letter-spacing:.30em;text-transform:uppercase}.live{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:rgba(18,13,14,.72);backdrop-filter:blur(14px);padding:8px 12px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 0 rgba(181,34,48,.55);animation:pulse 1.6s ease-in-out infinite}.hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .3s}.hero.hidden{opacity:0}.hero h1{margin:0;font-size:clamp(48px,8vw,92px);letter-spacing:.22em;text-indent:.22em;text-shadow:0 0 28px rgba(181,34,48,.65)}.hero p{margin:16px 0 0;color:var(--muted);font-size:12px;letter-spacing:.26em;text-transform:uppercase}.notice{position:absolute;top:92px;left:50%;transform:translateX(-50%);max-width:min(90vw,680px);padding:9px 14px;border:1px solid rgba(215,170,53,.42);background:rgba(18,13,14,.88);border-radius:999px;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;text-align:center;display:none}.console{pointer-events:auto;position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--border);background:rgba(18,13,14,.82);backdrop-filter:blur(18px);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}.inner{max-width:1150px;margin:auto;display:flex;flex-direction:column;gap:13px}.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.track{background:rgba(33,23,25,.68);border:1px solid var(--border);color:var(--fg);padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer;transition:.18s}.track:hover{border-color:rgba(215,170,53,.6)}.track.active{border-color:rgba(181,34,48,.85);background:rgba(181,34,48,.12);box-shadow:0 0 28px -12px rgba(181,34,48,.8)}.track .kick{display:block;color:var(--gold);font-size:9px;font-weight:700;letter-spacing:.28em;text-transform:uppercase}.track .name{display:block;margin-top:5px;font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.track .meta{display:block;margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.10em}.seekrow{display:flex;align-items:center;gap:10px}.time{width:42px;color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.time:first-child{text-align:right}.seek{width:100%;appearance:none;height:6px;border-radius:999px;background:linear-gradient(to right,var(--primary) 0,var(--gold) var(--seek,0%),#342527 var(--seek,0%),#342527 100%);cursor:pointer}.seek::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(215,170,53,.8)}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:var(--elev);color:var(--fg);padding:9px 17px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;cursor:pointer}.btn:hover{border-color:var(--gold);color:var(--gold)}.btn.primary{background:var(--primary);border-color:var(--primary);color:white;box-shadow:0 0 34px -12px var(--primary)}.btn.vr{background:transparent;border-color:var(--gold);color:var(--gold);box-shadow:0 0 30px -14px var(--gold)}.btn:disabled{opacity:.38;cursor:not-allowed}.hint{color:var(--muted);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.hidden-video{position:fixed;width:2px;height:2px;opacity:.001;pointer-events:none}.tap{position:absolute;inset:0;pointer-events:auto;background:transparent;border:0;cursor:grab}.tap:active{cursor:grabbing}@keyframes pulse{50%{opacity:.5;box-shadow:0 0 0 7px rgba(181,34,48,0)}}
@media(max-width:760px){.header{padding:15px}.brand-title{font-size:12px}.live{font-size:8px}.tracks{grid-template-columns:1fr}.track{padding:8px 10px}.track .meta{display:none}.console{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.hint{display:none}.hero{justify-content:flex-start;padding-top:34vh}.hero h1{font-size:42px}.controls{gap:8px}.btn{padding:9px 12px;font-size:9px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"}}</script>
</head>
<body>
<div class="stage" id="stage"></div>
<video id="film" class="hidden-video" playsinline webkit-playsinline preload="metadata" muted crossorigin="anonymous"></video>
<div class="hud">
<button class="tap" id="lookSurface" aria-label="Drag to look around"></button>
<header class="header"><div><div class="brand-kicker">RearVuez × Al3X MiX</div><div class="brand-title">WORDS — The Virtual Club</div></div><div class="live"><span class="dot"></span>VR Floor Open</div></header>
<div class="hero" id="hero"><h1>WORDS VR</h1><p>Choose a film, then enter the floor</p></div>
<div class="notice" id="notice"></div>
<section class="console"><div class="inner"><div class="tracks" id="tracks"></div><div class="seekrow"><span class="time" id="current">0:00</span><input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span class="time" id="duration">0:00</span></div><div class="controls"><div class="group"><button class="btn primary" id="play">Play</button><button class="btn" id="mute">Unmute</button><button class="btn" id="recenter">Recenter</button></div><div class="group"><span class="hint">Drag to look · Production reel</span><button class="btn vr" id="vr">Enter VR</button></div></div></div></section>
</div>
<script type="module">
import * as THREE from 'three';

const ASSET='https://rearvuez-words-vr.lovable.app';
const TRACKS=[
 {id:'words',title:'WORDS (SIR YES SIR)',artist:'RearVuez × Al3X MiX',duration:'4:27',kicker:'Sir, yes sir',video:ASSET+'/__l5e/assets-v1/073554e1-3fff-484d-b805-20a2237e43d8/words.mp4',poster:ASSET+'/__l5e/assets-v1/f5ce3e15-2dd8-4957-93c4-d6487d2178f2/words.jpg'},
 {id:'dance',title:'THE DANCE FLOOR KNOWS',artist:'RearVuez',duration:'4:53',kicker:'Cut 2',video:ASSET+'/__l5e/assets-v1/aa61207f-8ab3-4581-8386-fc30685ade76/dance-floor-knows.mp4',poster:ASSET+'/__l5e/assets-v1/445a01c1-6e37-4318-bc82-36ada149942d/dance-floor-knows.jpg'},
 {id:'chk',title:"CHK N' DKN",artist:'Al3X MiX',duration:'3:20',kicker:"Director's Cut",video:ASSET+'/__l5e/assets-v1/dbb09aa8-1b3d-4d41-8737-2f0bda40e570/chk-n-dkn.mp4',poster:ASSET+'/__l5e/assets-v1/6192d333-724c-4466-9afa-978894c6e7e4/chk-n-dkn.jpg'}
];
const film=document.getElementById('film'),tracks=document.getElementById('tracks'),play=document.getElementById('play'),mute=document.getElementById('mute'),seek=document.getElementById('seek'),cur=document.getElementById('current'),dur=document.getElementById('duration'),hero=document.getElementById('hero'),notice=document.getElementById('notice'),recenter=document.getElementById('recenter'),vrBtn=document.getElementById('vr');
let active=0,entered=false,noticeTimer;
const fmt=s=>{if(!Number.isFinite(s))return'0:00';const m=Math.floor(s/60),ss=Math.floor(s%60);return `${m}:${String(ss).padStart(2,'0')}`};
function msg(text){notice.textContent=text;notice.style.display='block';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.style.display='none',4000)}
TRACKS.forEach((t,i)=>{const b=document.createElement('button');b.className='track'+(i===0?' active':'');b.innerHTML=`<span class="kick">${t.kicker}</span><span class="name">${t.title}</span><span class="meta">${t.artist} · ${t.duration}</span>`;b.onclick=()=>loadTrack(i,false);tracks.appendChild(b)});
function loadTrack(i,autoplay=false){
 active=i; const t=TRACKS[i];
 film.pause(); film.removeAttribute('src'); film.load(); film.currentTime=0;
 cur.textContent='0:00'; dur.textContent='0:00'; seek.value=0; seek.style.setProperty('--seek','0%'); play.textContent='Play';
 [...tracks.children].forEach((b,n)=>b.classList.toggle('active',n===i));
 setPoster(t.poster); film.poster=t.poster; film.src=t.video; film.load();
 if(autoplay&&entered) film.play().catch(()=>msg('Tap Play to start this film'));
}
film.addEventListener('play',()=>{play.textContent='Pause';hero.classList.add('hidden')});
film.addEventListener('pause',()=>play.textContent='Play');
film.addEventListener('loadedmetadata',()=>dur.textContent=fmt(film.duration));
film.addEventListener('timeupdate',()=>{if(film.duration){const p=(film.currentTime/film.duration)*1000;seek.value=p;seek.style.setProperty('--seek',`${p/10}%`);cur.textContent=fmt(film.currentTime);dur.textContent=fmt(film.duration)}});
film.addEventListener('ended',()=>loadTrack((active+1)%TRACKS.length,false));
film.addEventListener('error',()=>msg('Production video could not load from the media host'));
play.onclick=async()=>{entered=true;hero.classList.add('hidden');if(film.paused){try{await film.play()}catch{film.muted=true;mute.textContent='Unmute';try{await film.play()}catch{msg('Tap Play again to start')}}}else film.pause()};
mute.onclick=()=>{film.muted=!film.muted;mute.textContent=film.muted?'Unmute':'Mute';if(!film.muted)film.volume=1};
seek.oninput=()=>{if(film.duration)film.currentTime=(Number(seek.value)/1000)*film.duration};

const mount=document.getElementById('stage');const scene=new THREE.Scene();scene.background=new THREE.Color('#050405');scene.fog=new THREE.FogExp2('#050405',.028);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,200);camera.position.set(0,1.65,9);const rig=new THREE.Group();rig.add(camera);scene.add(rig);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.xr.enabled=true;mount.appendChild(renderer.domElement);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:'#0b0809',roughness:.24,metalness:.72}));floor.rotation.x=-Math.PI/2;scene.add(floor);const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:'#070506',roughness:.95}));ceiling.rotation.x=Math.PI/2;ceiling.position.y=7;scene.add(ceiling);const walls=new THREE.Mesh(new THREE.BoxGeometry(44,7,44),new THREE.MeshStandardMaterial({color:'#0a0708',roughness:.85,metalness:.2,side:THREE.BackSide}));walls.position.y=3.5;scene.add(walls);
const videoTexture=new THREE.VideoTexture(film);videoTexture.colorSpace=THREE.SRGBColorSpace;const screenMat=new THREE.MeshBasicMaterial({map:videoTexture,toneMapped:false});const screen=new THREE.Mesh(new THREE.PlaneGeometry(12.8,7.2),screenMat);screen.position.set(0,4.1,-10.4);scene.add(screen);const frame=new THREE.Mesh(new THREE.PlaneGeometry(13.2,7.6),new THREE.MeshBasicMaterial({color:'#c9a227'}));frame.position.set(0,4.1,-10.5);scene.add(frame);const glow=new THREE.Mesh(new THREE.PlaneGeometry(26.8,17.2),new THREE.MeshBasicMaterial({color:'#7a1220',transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false}));glow.position.set(0,4.1,-10.7);scene.add(glow);
scene.add(new THREE.AmbientLight(0x30181c,1.1));scene.add(new THREE.HemisphereLight(0x51232c,0x0a0708,.5));const redA=new THREE.PointLight(0xe11d2f,26,34,2);redA.position.set(-9,5.4,-2);scene.add(redA);const redB=new THREE.PointLight(0xff3355,20,30,2);redB.position.set(9,5.4,2);scene.add(redB);const gold=new THREE.PointLight(0xf0c419,18,30,2);gold.position.set(0,6.2,5);scene.add(gold);
const beams=[];[0xe11d2f,0xf0c419,0xe11d2f,0xf0c419].forEach((c,i)=>{const b=new THREE.Mesh(new THREE.ConeGeometry(.9,13,24,1,true),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.09,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));b.position.set(-10+i*6.5,6.6,1.5+(i%2)*4);beams.push(b);scene.add(b)});
const pucks=[];for(let i=0;i<28;i++){const a=i/28*Math.PI*2,r=6+(i%4)*2.1,p=new THREE.Mesh(new THREE.CircleGeometry(.5,24),new THREE.MeshBasicMaterial({color:i%2?0xf0c419:0xe11d2f,transparent:true,opacity:.28,blending:THREE.AdditiveBlending,depthWrite:false}));p.rotation.x=-Math.PI/2;p.position.set(Math.sin(a)*r,.02,Math.cos(a)*r-1);pucks.push(p);scene.add(p)}
[-8.2,8.2].forEach(x=>{for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.6,1.8),new THREE.MeshStandardMaterial({color:'#121011',roughness:.6,metalness:.45}));c.position.set(x,.8+i*1.65,-8.6);scene.add(c)}});
const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');let posterTex=null;function setPoster(url){loader.load(url,tex=>{tex.colorSpace=THREE.SRGBColorSpace;if(posterTex)posterTex.dispose();posterTex=tex})}
let yaw=0,pitch=0,ty=0,tp=0,drag=false,lx=0,ly=0;const look=document.getElementById('lookSurface');look.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)};look.onpointermove=e=>{if(!drag)return;ty-=(e.clientX-lx)*.0038;tp-=(e.clientY-ly)*.0032;tp=Math.max(-.7,Math.min(.7,tp));lx=e.clientX;ly=e.clientY};look.onpointerup=e=>{drag=false;if(look.hasPointerCapture(e.pointerId))look.releasePointerCapture(e.pointerId)};recenter.onclick=()=>{ty=tp=0;rig.position.set(0,0,0)};
let session=null;const xr=navigator.xr;if(xr?.isSessionSupported){xr.isSessionSupported('immersive-vr').then(ok=>vrBtn.disabled=!ok).catch(()=>vrBtn.disabled=true)}else vrBtn.disabled=true;vrBtn.onclick=async()=>{if(!xr)return;if(session){await session.end();return}try{session=await xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});await renderer.xr.setSession(session);vrBtn.textContent='Exit VR';session.addEventListener('end',()=>{session=null;vrBtn.textContent='Enter VR'})}catch{msg('VR session refused by this device or browser')}};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;yaw+=(ty-yaw)*Math.min(1,dt*9);pitch+=(tp-pitch)*Math.min(1,dt*9);if(!renderer.xr.isPresenting)camera.rotation.set(pitch,yaw,0,'YXZ');beams.forEach((b,i)=>{b.rotation.z=Math.sin(t*.6+i)*.6;b.rotation.x=Math.cos(t*.45+i*1.7)*.45;b.material.opacity=.06+Math.abs(Math.sin(t*1.4+i))*.09});pucks.forEach((p,i)=>p.material.opacity=.12+Math.abs(Math.sin(t*2+i*.5))*.35);redA.intensity=20+Math.sin(t*2.2)*8;redB.intensity=16+Math.cos(t*1.7)*7;gold.intensity=14+Math.sin(t*1.1)*6;const live=film.readyState>=2&&!film.paused;const wanted=live?videoTexture:(posterTex||videoTexture);if(screenMat.map!==wanted){screenMat.map=wanted;screenMat.needsUpdate=true}renderer.render(scene,camera)});
loadTrack(0,false);
</script>
</body>
</html>
